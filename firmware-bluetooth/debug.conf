# Debug build: log output over a USB serial (CDC ACM) port.
# Build with: west build -b seeed_xiao_nrf52840 -- -DOVERLAY_CONFIG=debug.conf -DDTC_OVERLAY_FILE=debug.overlay
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_MODE_DEFERRED=y
